server {
    root /home/isucon/isucon10-qualify/webapp/public;
    listen 80 default_server;
    listen [::]:80 default_server;

    # bot はコンバージョンに繋がらないので、アプリと MySQL に到達させずここで落とす。
    # ベンチの BotWorker は chair 検索(いま最重量のクエリ)を叩いてくるが、
    # スコアには一切寄与しない。
    if ($isu_bot) {
        return 503;
    }

    location /api {
            proxy_pass http://localhost:1323;
    }

    location /initialize {
            proxy_pass http://localhost:1323;
    }

    location / {
            root /www/data;
    }
}