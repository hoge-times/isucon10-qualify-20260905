server {
    root /home/isucon/isucon10-qualify/webapp/public;
    listen 80 default_server;
    listen [::]:80 default_server;

    # bot はコンバージョンに繋がらないので、アプリと MySQL に到達させずここで落とす。
    # ベンチの BotWorker は chair 検索(いま最重量のクエリ)を叩いてくるが、
    # スコアには一切寄与しない。
    if ($isu_bot) {
        return 503;
    }

    # アクセスログの ON/OFF。nginx.conf の http レベルは access_log off で、
    # ここに on.conf があるときだけ server レベルで上書きされ ltsv で記録される。
    # access-log.d の中身は make nlogon / nlogoff が置く実行時ファイルで Git 管理外
    # (実行時に追跡ファイルを書き換えるとサーバー側の git pull が壊れるため)。
    # ファイルが1つも無くても wildcard include はエラーにならない。
    include /etc/nginx/access-log.d/*.conf;

    location /api {
            proxy_pass http://isuumo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
    }

    location /initialize {
            proxy_pass http://isuumo_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
    }

    location / {
            root /www/data;
    }
}