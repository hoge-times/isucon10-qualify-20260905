user  www-data;
worker_processes  auto;
# ワーカーあたりの fd 上限。worker_connections を増やすならこちらも上げる必要がある。
worker_rlimit_nofile  32768;

error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;


events {
    worker_connections  8096;
    multi_accept        on;   # 溜まっている接続をまとめて accept する
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # alp で集計するための LTSV 形式
    log_format ltsv "time:$time_local"
        "\thost:$remote_addr"
        "\tforwardedfor:$http_x_forwarded_for"
        "\treq:$request"
        "\tstatus:$status"
        "\tmethod:$request_method"
        "\turi:$request_uri"
        "\tsize:$body_bytes_sent"
        "\treferer:$http_referer"
        "\tua:$http_user_agent"
        "\treqtime:$request_time"
        "\tcache:$upstream_http_x_cache"
        "\truntime:$upstream_http_x_runtime"
        "\tapptime:$upstream_response_time"
        "\tvhost:$host";

    # アクセスログは既定で切る。1リクエストごとの書き込みが CPU と I/O を食い、
    # スコアを狙う走行では純粋な無駄になる。
    # 計測したいときは make logon(= nlogon)が /etc/nginx/access-log.d/on.conf を
    # 置き、server ブロックの include 経由でこの off を上書きする。
    # log_format ltsv はそのときのために残してある。
    access_log off;

    # bot からのリクエストに 503 を返す(マニュアル「bot からのリクエスト」で許可されている)。
    # マニュアル記載の正規表現をそのまま移植する。最後の1本だけ大文字小文字を無視する(~*)。
    #
    # 最後の行の (?:[-_ ./;@()]|$) が肝で、(bot|crawler|spider) の直後に区切り文字か
    # 行末を要求している。これを省くと正規の UA "ISUCON Web Browser bottle-<uuid>" の
    # "bottle" を bot と誤判定して実ユーザーを弾き、減点どころか失格になる。
    #
    # nginx の設定値は空白と ; がトークンの区切りなので、文字クラス内では
    # 空白を \x20、; を \x3B と書いている。
    map $http_user_agent $isu_bot {
        default                                                       0;
        ~ISUCONbot(-Mobile)?                                          1;
        ~ISUCONbot-Image/                                             1;
        ~Mediapartners-ISUCON                                         1;
        ~ISUCONCoffee                                                 1;
        ~ISUCONFeedSeeker(Beta)?                                      1;
        ~crawler\x20\(https://isucon\.invalid/(support/faq/|help/jp/) 1;
        ~isubot                                                       1;
        ~Isupider                                                     1;
        ~Isupider(-image)?\+                                          1;
        ~*(bot|crawler|spider)(?:[-_\x20./\x3B@()]|$)                 1;
    }

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    open_file_cache max=100 inactive=20s;

    # ベンチは同一ホストから叩くのでクライアント側の接続は使い回させる。
    keepalive_requests 1000000;
    keepalive_timeout  600s;

    # 大きめのレスポンス(検索結果は 15KB 程度)をディスクに落とさず捌く。
    proxy_buffer_size  8k;
    proxy_buffers      100 32k;

    # gzip はあえて入れない。ベンチは 127.0.0.1 から叩くので帯域がボトルネックに
    # ならず、CPU が既に 97% 飽和しているため圧縮コストのぶん不利になる。
    #gzip  on;

    # アプリへの接続を使い回す。これが無いとリクエストごとに TCP を張り直す。
    upstream isuumo_app {
        server 127.0.0.1:1323;
        keepalive 128;
    }

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*.conf;
}